; =============================================================================
;  outils\config.ini - LE fichier de paramètres de la chaîne XPGAnalyser
; -----------------------------------------------------------------------------
;  Lu par tous les scripts de outils\ (compilation, installateur, package hors
;  ligne) ; package.bat en tire maintenance\config.ini pour les scripts
;  installés avec le programme. Le détail de chaque clé : docs\CONFIG-INI.md.
;
;  Une valeur marquée À_RENSEIGNER manque : le script qui en a besoin s'arrête
;  et dit laquelle. Une valeur vide : la valeur par défaut, ou « sans ».
;  Chemins : absolus, ou relatifs au dossier du projet (celui de
;  XpgAnalyzer.sln) ; jetons possibles : {Documents} {LocalAppData} {AppData}
;  {ProgramData} {ProgramFiles} {ProgramFiles(x86)} {pf} {pf32} {Racine}, et
;  les %VARIABLES% de Windows. Un commentaire en fin de ligne : " ; ...".
;  Encodage : UTF-8 (le Bloc-notes le garde).
; =============================================================================

[Produit]
; Le nom montré dans « Applications installées », le menu Démarrer, l'installateur.
nom = XPGAnalyser
editeur = XPGAnalyser
version = 1.11.13
; L'identité de l'installation pour Windows. NE JAMAIS LA CHANGER : c'est elle qui
; fait d'une nouvelle version une mise à jour (et pas un deuxième logiciel).
app_id = {68A57092-419E-4BEF-8486-57B131E9C592}
exe = XpgAnalyzer.exe
description = Analyse, IHM et simulation de projets Control Expert
; Facultatif : le lien « Aide » de la fiche dans Applications installées.
url_support =

[Projet]
solution = XpgAnalyzer.sln
vcxproj = XpgAnalyzer.vcxproj
plateforme = x64
; Le dossier de construction des tests (CMake + Ninja).
cmake_tests = build\cmake-tests

[Compilateur]
; msvc : Microsoft C++ Build Tools 2022 (v143) - la chaîne du projet.
chaine = msvc
; « Sélectionner manuellement un compilateur déjà installé » l'écrit ici : le dossier
; d'une installation de Visual Studio 2022 ou des Build Tools (celui qui contient VC\).
compilateur_manuel =
msvc_version_min = 14.30

[Outils]
; vswhere : trouvé tout seul (dossier de l'installateur de Visual Studio) ; ici pour un autre.
vswhere =
; ISCC.exe d'Inno Setup : trouvé tout seul (registre, emplacements standards) ; ici pour un autre.
iscc =
; Microsoft C++ Build Tools 2022 : la source officielle (HTTPS).
buildtools_url = https://aka.ms/vs/17/release/vs_BuildTools.exe
buildtools_editeur = Microsoft Corporation
; Volontairement vide : Microsoft change ce fichier à chaque version ; sa signature
; Authenticode (Microsoft Corporation) est vérifiée à la place.
buildtools_sha256 =
buildtools_licence = https://visualstudio.microsoft.com/license-terms/
; Les composants, et eux seuls (séparés par ;). MSBuild fait partie des Build Tools.
buildtools_composants = Microsoft.VisualStudio.Workload.VCTools;Microsoft.VisualStudio.Component.VC.Tools.x86.x64;Microsoft.VisualStudio.Component.Windows11SDK.22621;Microsoft.VisualStudio.Component.VC.CMake.Project
; Vide : le dossier par défaut de Microsoft (C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools).
buildtools_dossier =
buildtools_espace_go = 7
; Inno Setup : la publication officielle (dépôt jrsoftware/issrc) ; signature et empreinte
; constatées le 29/09/2026 sur ce fichier.
innosetup_version = 6.7.2
innosetup_url = https://github.com/jrsoftware/issrc/releases/download/is-6_7_2/innosetup-6.7.2.exe
innosetup_editeur = Pyrsys B.V.
innosetup_sha256 = 9f27f8386e554eb093336a1ca5c2dcacb7dbf04ab020889491d7ac53c38a12ff

[HorsLigne]
; Le package fait par create_offline_toolchain.bat (seulement pour un PC sans Internet).
dossier = À_RENSEIGNER

[Installateur]
; Le dossier de travail de l'installateur : staging\ (ce qui est installé) et SHA256SUMS.txt.
; L'installateur lui-même (XPGAnalyser-Setup-<version>.exe) est posé à la racine du dossier.
sortie = dist
; Le dossier des données proposé pendant l'installation ({Documents} : celui de chaque compte).
dossier_donnees_par_defaut = {Documents}\XPGAnalyser
; Où chercher les anciennes versions à reprendre (séparés par ;) : ton dossier de
; développement et l'installation du lot 8 (trouvée aussi par le registre).
anciens_dossiers = {pf32}\XpgAnalyzer;{pf}\XpgAnalyzer;{localappdata}\Programs\XpgAnalyzer
; Pas de certificat : l'installateur n'est pas signé (Windows SmartScreen avertit).
certificat =

[Maintenance]
; Les sauvegardes gardées (avant mise à jour, réparation, restauration) ; les plus anciennes partent.
sauvegardes_a_garder = 3
